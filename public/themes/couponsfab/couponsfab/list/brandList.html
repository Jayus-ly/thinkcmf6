<script>
    var mobileAgent = new Array("iphone", "android", "blackberry", "webos", "incognito", "webmate", "bada", "nokia", "lg", "ucweb", "skyfire");
    var browser = navigator.userAgent.toLowerCase();
    var isMobile = false;
    for (var i = 0; i < mobileAgent.length; i++) {
        if (browser.indexOf(mobileAgent[i]) != -1) {
            isMobile = true;


            break;
        } else {
            isMobile = false;

        }
    }
    ;

    function changeLetter(flag, index) {
        letter = flag;
        couponListContent(true);
        const letterList = document.querySelectorAll(".letter");
        for (let num = 0; num < letterList.length; num++) {
            letterList[num].setAttribute("class", "letter");
        }
        let letterItem = document.getElementsByClassName("letter")[index];
        letterItem.setAttribute("class", "letter letterNow");
    }


    let page = 1;
    let pageSize = 20;
    var adsIndex = 0;
    var pageCount = 1;
    var brandsList = [];
    var letter = "A";
    var activeValue = <?php echo $active; ?>;
    var cate = <?php echo $cate; ?>;

    changeLetter(letter, 0);

    function couponListContent(change) {


        if (change) {
            var detaiListBox = document.getElementsByClassName('brandsWrap')[0];
            var detailListUl = document.getElementsByClassName('brandsList')[0];
            detaiListBox.removeChild(detailListUl);
            var newUl = document.createElement('ul');
            newUl.setAttribute("class", "brandsList");
            detaiListBox.appendChild(newUl);

            page = 1;
            pageSize = 20;
        }

        ajax({
            type: "GET",
            url: "brandListPage",
            async: false,
            data: {
                "page": page,
                "size": pageSize,
                "startStr": letter,
                "active":activeValue,
                "cate":cate,
            },
            success: function (data) {

                var date = JSON.parse(data);

                pageCount = date.data.PageCount;
                brandsList = date.data.Products;
                console.log(brandsList);
                if (brandsList != null || brandsList.length !== 0) {
                    if (page <= pageCount) {
                        for (var i = 0; i < brandsList.length; i++) {
                            itemLi(brandsList[i]);
                        }
                    } else {


                    }
                    lazyImg();
                } else {
                    console.log('接口没有数据！');
                }
            }
        });
    }


    function itemLi(item) {
        var newUl = document.getElementsByClassName('brandsList')[0];
        var brandItem = document.createElement("li");
        brandItem.setAttribute("class", "brandItem");

        var link = document.createElement("a");
        link.setAttribute("class", "brandLink");
        if ("") {
            link.setAttribute("href", "/couponsfab/info/index?id=" + item.Route + "?");
        } else {
            link.setAttribute("href", "/couponsfab/info/index?id=" + item.Route);
        }
        link.setAttribute("aria-label", "go brand" + item.Route + "page");


        newUl.appendChild(brandItem);
        brandItem.appendChild(link);

        var brandTop = document.createElement("div");
        brandTop.setAttribute("class", "brandTop");

        var brandImg = document.createElement("img");
        brandImg.setAttribute("class", "brandImg lazyImg");
        brandImg.setAttribute("src", item.ImgUrl);
        brandImg.setAttribute("data-src", item.ImgUrl);

        brandImg.setAttribute("alt", item.Name + " icon");

        var brandLine = document.createElement("div");
        brandLine.setAttribute("class", "brandLine");
        var leftHalf = document.createElement("div");
        leftHalf.setAttribute("class", "leftHalf");
        var rightHalf = document.createElement("div");
        rightHalf.setAttribute("class", "rightHalf");

        var couponDetail = document.createElement("div");
        couponDetail.setAttribute("class", "couponDetail");
        var brandName = document.createElement("div");
        brandName.setAttribute("class", "brandName");
        brandName.innerText = item.Name;
        var brandNum = document.createElement("div");
        brandNum.setAttribute("class", "brandNum");
        brandNum.innerText = item.CouponNum + " Coupons";


        brandItem.appendChild(brandTop);
        brandItem.appendChild(brandLine);
        brandItem.appendChild(couponDetail);

        brandTop.appendChild(brandImg);

        brandLine.appendChild(leftHalf);
        brandLine.appendChild(rightHalf);

        couponDetail.appendChild(brandName);
        couponDetail.appendChild(brandNum);

    }


    var viewHeight = document.documentElement.clientHeight;

    function GetRect(element) {
        let rectbox = element.getBoundingClientRect();
        let top = document.documentElement.clientTop ? document.documentElement.clientTop : 0;
        let left = document.documentElement.clientLeft ? document.documentElement.clientLeft : 0;
        return {
            top: rectbox.top - top,
            bottom: rectbox.bottom - top,
            left: rectbox.left - left,
            right: rectbox.right - left
        }
    }

    let moreFlag = document.querySelector('.blogsWrap');
    window.onscroll = function () {
        let obj = GetRect(moreFlag)
        if (obj.top < viewHeight && obj.bottom >= viewHeight) {
            let is_running = true;
            if (is_running && page < pageCount) {
                page += 1;
                couponListContent(false);
                is_running = false;
            } else {


            }
        }
    };


</script>
