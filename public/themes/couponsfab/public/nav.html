<script>
    var width = window.innerWidth || document.documentElement.clientWidth;
    var isMobile, isTablet, isPc = false;
    if (width < 768) {
        isMobile = true;

    } else if (width >= 768 && width < 1367) {

        isTablet = true;
    } else {

        isPc = true;
    }
    var isBannerEvent = 0;

    if ("SPRING SAVINGS BLOWOUT!") {
        isBannerEvent = 0;
    } else {
        isBannerEvent = -1;
    }
    var headFlag = 7;
    if ("/" == "/event/spring-sale") {
        headFlag = 0 + isBannerEvent;
    } else if ("/" == "/brand/temu") {
        headFlag = 1 + isBannerEvent;
    } else if ("/" == "/brand/amazon") {
        headFlag = 2 + isBannerEvent;
    } else if ("/" == "/free-stuff") {
        headFlag = 5 + isBannerEvent;
    } else if ("/" == "/recommendations" || "/" == "/blog") {
        headFlag = 6 + isBannerEvent;
    }
    if (headFlag < 7) {
        if (isPc) {
            var topTitle = document.getElementsByClassName("navLink")[headFlag];
            topTitle.style.color = "#F82C4C";
        } else {
            var topTitle = document.getElementsByClassName("sideTitle")[headFlag];
            topTitle.style.color = "#F82C4C";
        }
    }


    var searchWrap = document.getElementsByClassName('searchWrap')[0];

    function searchShow() {
        searchWrap.style.display = "block";
    }

    function searchClose() {
        searchWrap.style.display = "none";
    }


    function jumpSearch(searchNode) {
        var seaTextIndex = document.querySelector(searchNode);
        var searchInputText = seaTextIndex.value;
        if (searchInputText !== '') {
            if ("") {
                window.location.href = "/search" + "?q=" + searchInputText + "&";
            } else {
                window.location.href = "/search" + "?q=" + searchInputText;
            }
        } else {

            console.log("Please enter the content of your search！");
        }
    }

    function enterSearch(searchNode) {
        var e = window.event;
        if (e.keyCode == 13) {
            jumpSearch(searchNode);
        }
    }


    var body = document.getElementsByTagName("body")[0];
    var mobileMenu = document.getElementsByClassName("mobileMenu")[0];
    var dropDown = document.getElementsByClassName("dropDown")[0];
    var closeMenu = document.getElementsByClassName("closeMenu")[0];
    mobileMenu.onclick = function () {
        dropDown.style.display = "block";
        body.style.overflow = "hidden";
    };
    closeMenu.onclick = function () {
        dropDown.style.display = "none";
        body.style.overflow = "scroll";
    };


    var brandListMobile = document.getElementById("brandListMobile");
    var brandCateMobile = document.getElementById("brandCateMobile");
    var productListMobile = document.getElementById("productListMobile");
    var productCateMobile = document.getElementById("productCateMobile");
    brandListMobile.onclick = function () {
        toggleCategory(brandListMobile, brandCateMobile, 0);
    };
    productListMobile.onclick = function () {
        toggleCategory(productListMobile, productCateMobile, 1);
    };

    function toggleCategory(list, category, arrowIndex) {
        let bottomArrows = document.getElementsByClassName("bottomArrow");
        let topArrows = document.getElementsByClassName("topArrow");


        for (let i = 0; i < bottomArrows.length; i++) {
            bottomArrows[i].style.display = "block";
            topArrows[i].style.display = "none";
        }


        if (category.style.display === "block") {
            category.style.display = "none";
            bottomArrows[arrowIndex].style.display = "block";
            topArrows[arrowIndex].style.display = "none";

            resetColor(list);
        } else {
            category.style.display = "block";
            bottomArrows[arrowIndex].style.display = "none";
            topArrows[arrowIndex].style.display = "block";

            setColor(list, "#E02845");
        }


        let otherCategory = arrowIndex === 0 ? productCateMobile : brandCateMobile;
        let otherList = arrowIndex === 0 ? productListMobile : brandListMobile;
        if (otherCategory.style.display === "block") {
            otherCategory.style.display = "none";
            bottomArrows[1 - arrowIndex].style.display = "block";
            topArrows[1 - arrowIndex].style.display = "none";

            resetColor(otherList);
        }
    }


    function setColor(category, color) {
        let navLink = category.getElementsByClassName("navLink")[0];
        navLink.style.color = color;
    }

    function resetColor(category) {
        setColor(category, "#333333");
    }

    function ajax(options) {
        var xhr = null;
        var params = formsParams(options.data);

        if (window.XMLHttpRequest) {
            xhr = new XMLHttpRequest()
        } else {
            xhr = new ActiveXObject("Microsoft.XMLHTTP");
        }

        if (options.type == "GET") {
            xhr.open(options.type, options.url + "?" + params, options.async);
            xhr.send(null)
            if (xhr.status === 200) {
                options.success(xhr.responseText)
            }
        } else if (options.type == "POST") {
            xhr.open(options.type, options.url, options.async);
            xhr.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=utf-8");
            xhr.send(params);
            xhr.onreadystatechange = function () {
                if (xhr.readyState == 4 && xhr.status == 200) {
                    options.success(xhr.responseText);
                }
            }
        }

        function formsParams(data) {
            var arr = [];
            for (var prop in data) {
                arr.push(prop + "=" + data[prop]);
            }
            return arr.join("&");
        }
    }


    ajax({
        type: "GET",
        url: "/couponsfab/list/getClassification",
        async: false,
        success: function (data) {
            var date = JSON.parse(data);

            var container = document.getElementById('brandCategories');
            var brandCateMobile = document.getElementById('brandCateMobile');

            var productCategories = document.getElementById('productCategories');
            var productCateMobile = document.getElementById('productCateMobile');

            var list = date.data.list;

            var productList = date.data.product_list;

            // 遍历分类数据
            list.forEach(function (item) {
                var a = document.createElement('a');
                a.className = 'cate';
                a.href = '/couponsfab/list/list?active=' + item.id + '&name=' + encodeURIComponent(item.name);
                a.setAttribute('aria-label', 'go brandList ' + item.name + ' page');
                a.innerText = item.name;
                container.appendChild(a);

                var b = document.createElement('a');
                b.className = 'cateMobile';
                b.href = '/couponsfab/list/list?active=' + item.id + '&name=' + encodeURIComponent(item.name);
                b.setAttribute('aria-label', 'go brandList ' + item.name + ' page');
                b.innerText = item.name;
                brandCateMobile.appendChild(b);
            });

            // 遍历分类数据
            productList.forEach(function (item) {
                var a = document.createElement('a');
                a.className = 'cate';
                a.href = '/couponsfab/productList/list?classification_id=' + item.id;
                a.setAttribute('aria-label', 'go brandList ' + item.name + ' page');
                a.innerText = item.name;
                productCategories.appendChild(a);

                var b = document.createElement('a');
                b.className = 'cateMobile';
                b.href = '/couponsfab/productList/list?classification_id=' + item.id;
                b.setAttribute('aria-label', 'go brandList ' + item.name + ' page');
                b.innerText = item.name;
                productCateMobile.appendChild(b);
            });



        }
    });

</script>
