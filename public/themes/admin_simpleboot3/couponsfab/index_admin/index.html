<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="#0" data-text="0" data-toggle="tab">{:lang('CAROUSEL')}</a></li>
        <li><a href="#1" data-text="1" data-toggle="tab">{:lang('TODAY_TOP_COUPONS')}</a></li>
        <li><a href="#2" data-text="2" data-toggle="tab">{:lang('POPULAR_PRODUCTS')}</a></li>
        <li><a href="#3" data-text="3" data-toggle="tab">{:lang('FEATURED_COUPONS')}</a></li>
        <li><a href="#4" data-text="4" data-toggle="tab">{:lang('HOT_CATEGORIES')}</a></li>
        <li><a href="#5" data-text="5" data-toggle="tab">{:lang('LATEST_BLOG')}</a></li>
        <li><a href="#6" data-text="6" data-toggle="tab">{:lang('FREQUENTLY_ASKED_QUESTIONS')}</a></li>
        <li><a href="#7" data-text="7" data-toggle="tab">{:lang('ABOUT_COUPONSFAB')}</a></li>
    </ul>
    <form class="form-horizontal js-ajax-form margin-top-20" role="form" method="post">
        <fieldset>
            <div class="tabbable">
                <div class="tab-content">
                    <div class="tab-pane active" id="0">

                        <div class="form-group">
                            <div class="col-sm-10">
                                <button onclick="openAuthorizeDialog(this)"
                                        data-href="{:url('indexAdmin/addCarouselView')}"
                                        data-text="{:lang('ADD_IMAGES')}"
                                        class="btn btn-primary js-ajax-submit" data-refresh="1"
                                >
                                    {:lang('ADD_IMAGES')}
                                </button>
                            </div>
                        </div>

                        <table class="layui-hide" id="table_0"></table>
                    </div>


                    <div class="tab-pane" id="1">
                        <div class="form-group">
                            <div class="col-sm-10">
                                <button onclick="openAuthorizeDialog(this)"
                                        data-href="{:url('indexAdmin/addCarouselView')}"
                                        data-text="{:lang('ADD_IMAGES')}"
                                        class="btn btn-primary js-ajax-submit" data-refresh="1"
                                >
                                    {:lang('ADD_TODAY_TOP_COUPONS')}
                                </button>
                            </div>
                        </div>

                        <table id="table_1" class="table table-hover table-bordered">
                            <thead>
                            <tr>
                                <th align="left">图片</th>
                                <th align="left">名称</th>
                                <th align="left">详细介绍</th>
                                <th align="left">销量</th>
                                <th align="left">排序</th>
                                <th align="left">创建时间</th>
                                <th align="left">更新时间</th>
                                <th width="160">{:lang('ACTIONS')}</th>
                            </tr>
                            </thead>
                            <tbody>
                            </tbody>
                        </table>
                    </div>


                </div>
            </div>
        </fieldset>
    </form>

</div>
<script type="text/javascript" src="__STATIC__/js/admin.js?v={$_static_version}"></script>
<script>
    Wind.css('layui');
    Wind.use('layui', function () {
        let table = layui.table;
        table.render({
            elem: '#table_0',
            url: "{:url('indexAdmin/getCarouselData')}", // 你的API接口地址
            cellMinWidth: 80,
            where: {type: 0},
            parseData: function(res){ // res 是服务器返回的 JSON
                return {
                    "code": res.code === 1 ? 0 : res.code, // 让 code 变成 Layui 需要的 0
                    "msg": res.msg,
                    "count": res.data.length, // 计算数据总数
                    "data": res.data // Layui 需要的 data 数组
                };
            },
            cols: [[
                {field: 'url', title: '图片', width: 200, templet: function(d){
                        return '<img src="'+d.url+'" width="50" height="50">';
                    }},
                {field:'name', title: '名称'},
                {field:'sort',  title: '排序'}
            ]],
            page:true
        });
    });

    function openAuthorizeDialog(obj) {
        const $obj = $(obj);
        const href = $obj.data('href');
        const text = $obj.data('text');
        parent.openIframeLayer(href, text, {
            area: GV.IS_MOBILE ? ['100%', '100%'] : ['95%', '95%'],
            offset: GV.IS_MOBILE ? ['0px', '0px'] : 'auto',
            yes: function (index, layero) {
                console.log(layero);
                var iframeWin = parent.window[layero.find('iframe')[0]['name']];
                parent.layer.close(index); //如果设定了yes回调，需进行手工关闭
            },
            end: function () {
            }
        });
    }

</script>


</body>
</html>
