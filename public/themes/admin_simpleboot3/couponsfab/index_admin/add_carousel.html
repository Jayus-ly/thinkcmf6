<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <form class="form-horizontal js-ajax-form margin-top-20" role="form" action="{:url('indexAdmin/addCarousel')}"
          method="post">
        <fieldset>
            <div class="tabbable">
                <div class="tab-content">
                    <div class="tab-pane active" id="A">
                        <div class="form-group">
                            <label for="input-site-name" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                图片名称
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-name" name="name" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="thumb" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                图片选择
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="hidden" name="image" id="thumb" value="">
                                <a href="javascript:uploadOneImage('图片上传','#thumb');">
                                    <img src="__TMPL__/public/assets/images/default-thumbnail.png" id="thumb-preview"
                                         width="135" style="cursor: hand"/>
                                </a>
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="input-site-sort" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                排序
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-sort" name="sort" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="input-site-detail" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                详细介绍
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-detail" name="detail" value="">
                            </div>
                        </div>
                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary js-ajax-submit" data-refresh="1">
                                    {:lang('SAVE')}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
</div>
<script type="text/javascript" src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
