<include file="public@header"/>
</head>
<body>
<div class="wrap js-check-wrap">
    <form class="form-horizontal js-ajax-form margin-top-20" role="form" action="{:url('Setting/sitePost')}"
          method="post">
        <fieldset>
            <div class="tabbable">
                <div class="tab-content">
                    <div class="tab-pane active" id="A">
                        <div class="form-group">
                            <label for="input-site-img" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                图片选择
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-img" name="options[site_name]" value="{$site_info.site_name|default=''}">
                            </div>
                        </div>
                        <div class="form-group">
                            <label for="input-site-couponName" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                couponName
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-couponName" name="couponName" value="">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="input-site-couponDetail" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                couponDetail
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-couponDetail" name="couponDetail" value="">
                            </div>
                        </div>

                        <div class="form-group">
                            <label for="input-site-couponDetail" class="col-sm-2 control-label">
                                <span class="form-required">*</span>
                                couponSales
                            </label>
                            <div class="col-md-6 col-sm-10">
                                <input type="text" class="form-control" id="input-site-couponSales" name="couponSales" value="">
                            </div>
                        </div>

                        <div class="form-group">
                            <div class="col-sm-offset-2 col-sm-10">
                                <button type="submit" class="btn btn-primary js-ajax-submit" data-refresh="1">
                                    {:lang('SAVE')}
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </fieldset>
    </form>
</div>
<script type="text/javascript" src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
