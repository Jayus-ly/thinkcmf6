<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>

</head>
<body>
<div class="wrap">
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('editCouponsPost')}">
        <div class="form-group">
            <label for="input-name" class="col-sm-2 control-label"><span class="form-required">*</span>优惠券名称</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-name" name="name" value="{$data.name}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-name" class="col-sm-2 control-label"><span class="form-required">*</span>优惠券类型</label>
            <select class="form-control" name="type" id="target" style="width: 400px">
                <option value="">请选择优惠券类型</option>
                <option value="0" {$data.type ?  "" : 'selected="selected"'}>CODE</option>
                <option value="1" {$data.type ? 'selected="selected"' : ""}>SALE</option>
            </select>
        </div>
        <div class="form-group">
            <label for="input-code" class="col-sm-2 control-label"><span class="form-required">*</span>优惠码</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-code" name="code" value="{$data.code}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-details" class="col-sm-2 control-label"><span class="form-required">*</span>详细介绍</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-details" name="details" value="{$data.details}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-used" class="col-sm-2 control-label"><span class="form-required">*</span>使用次数</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-used" name="used" value="{$data.used}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-is_new" class="col-sm-2 control-label"><span class="form-required">*</span>优惠券是否上新</label>
            <select class="form-control" id="input-is_new" name="is_new" style="width: 400px">
                <option value="">请选择</option>
                <option value="0" {$data.is_new ?  "" : 'selected="selected"'}>否</option>
                <option value="1" {$data.is_new ? 'selected="selected"' : ""}>是</option>
            </select>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="hidden" name="id" value="{$data.id|default=0}" />
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="{:url('couponsList')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
