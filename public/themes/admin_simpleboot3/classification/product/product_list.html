<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>

</head>
<style>
    .switch {
        position: relative;
        display: inline-block;
        width: 44px;
        height: 24px;
    }

    .switch input {
        opacity: 0;
        width: 0;
        height: 0;
    }

    .slider {
        position: absolute;
        cursor: pointer;
        top: 0; left: 0;
        right: 0; bottom: 0;
        background-color: #ccc;
        transition: .4s;
        border-radius: 24px;
    }

    .slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: white;
        transition: .4s;
        border-radius: 50%;
    }

    input:checked + .slider {
        background-color: #4CAF50;
    }

    input:checked + .slider:before {
        transform: translateX(20px);
    }
</style>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">产品分类列表</a></li>
        <li class="active"><a href="{:url('productList')}">产品列表</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="post" action="{:url('classification/product/productList')}">
        名称
        <input type="text" name="name" class="form-control" value="{:input('request.name')}" placeholder="输入名称搜索">
        <input type="submit" class="btn btn-primary" value="{:lang('Search')}"/>
        <a class="btn btn-danger" href="{:url('productList')}">{:lang('Clear')}</a>
        <a class="btn btn-primary" href="<?php echo url('addProduct'); ?>">新增产品</a>
    </form>
    <form method="post" class="js-ajax-form">
        <table class="table table-hover table-bordered table-list" id="menus-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>产品名称</th>
                <th>产品图片</th>
                <th>新价格</th>
                <th>旧价格</th>
                <th>所属分类ID</th>
                <th>是否热门商品</th>
                <th>首页显示</th>
                <th>创建时间</th>
                <th>更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.name}</td>
                    <td>
                        <img src="{:cmf_get_image_preview_url($vo.img_url)}" width="135" style="cursor: hand"/>
                    </td>
                    <td>{$vo.new_price}</td>
                    <td>{$vo.old_price}</td>
                    <td>{$vo.classification_id}</td>
                    <td>{$vo.is_hot}</td>

                    <td>
                        <label class="switch">
                            <input type="checkbox" class="is-home-toggle" data-id="{$vo.id}" {$vo.is_home ? 'checked' : ''}>
                            <span class="slider round"></span>
                        </label>
                    </td>

                    <td>{$vo.create_time}</td>
                    <td>{$vo.update_time}</td>
                    <td>
                        <a class="btn btn-xs btn-primary" href="{:url('editProduct',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delProductPost',array('id'=>$vo['id']))}">
                            {:lang('DELETE')}
                        </a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
</div>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
<script>
    $(document).ready(function () {
        Wind.css('treeTable');
        Wind.use('treeTable', function () {
            $("#menus-table").treeTable({
                indent: 20
            });
        });
    });

    document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('.is-home-toggle').forEach(function (checkbox) {
            checkbox.addEventListener('change', function () {
                const id = this.dataset.id;
                const is_home = this.checked ? 1 : 0;

                $.ajax({
                    url: 'changProductIsHome', // 替换成你的接口地址
                    type: 'POST',
                    data: {
                        id: id,
                        is_home: is_home
                    },
                    dataType: 'json',
                    success: function (res) {
                        if (res.code === 1) {
                            console.log('更新成功');
                        } else {
                            alert('更新失败：' + res.msg);
                            checkbox.checked = !checkbox.checked; // 恢复原状态
                        }
                    },
                    error: function () {
                        alert('网络错误');
                        checkbox.checked = !checkbox.checked; // 恢复原状态
                    }
                });
            });
        });
    });
</script>
</body>
</html>
