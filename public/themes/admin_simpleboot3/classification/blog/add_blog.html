<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>

<link href="/static/css/select2.min.css" rel="stylesheet" />
<script src="/themes/admin_simpleboot3/public/assets/js/jquery-3.6.0.min.js"></script>
<script src="/static/js/select2.min.js"></script>

</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">博客列表</a></li>
        <li  class="active"><a href="{:url('addBlog')}">添加博客</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('addBlogPost')}">
        <div class="form-group">
            <label for="input-title" class="col-sm-2 control-label"><span class="form-required">*</span>博客标题</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-title" name="title" value="{$data.title|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-subtitle" class="col-sm-2 control-label"><span class="form-required">*</span>博客副标题</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-subtitle" name="subtitle" value="{$data.subtitle|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-about" class="col-sm-2 control-label"><span class="form-required">*</span>博客详细介绍</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-about" name="about" value="{$data.about|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label for="thumb" class="col-sm-2 control-label"><span class="form-required">*</span>上传图片</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="img_url" id="thumb" value="">
                <a href="javascript:uploadOneImage('图片上传','#thumb');">
                    <if condition="empty($data['img_url'])">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png"
                             id="thumb-preview" width="135" style="cursor: hand"/>
                        <else/>
                        <img src="{:cmf_get_image_preview_url($data['img_url'])}" id="thumb-preview"
                             width="135" style="cursor: hand"/>
                    </if>

                </a>
                <input type="button" class="btn btn-sm"
                       onclick="$('#thumb-preview').attr('src','/themes/admin_simpleboot3/public/assets/images/default-thumbnail.png');$('#thumb').val('');return false;"
                       value="取消图片">
            </div>
        </div>
        <div class="form-group">
            <label for="input-tags" class="col-sm-2 control-label">
                <span class="form-required">*</span>关联品牌
            </label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control select2" id="input-tags" name="bind_item_classification[]" multiple="multiple" style="width: 100%;">
                    <foreach name="array" item="vo">
                        <option value="{$vo['id']}">{$vo['name']}_{$vo['id']}</option>
                    </foreach>
                </select>
            </div>
        </div>
        <script>
            $(function() {
                $('.select2').select2({
                    placeholder: "请选择品牌(品牌名称+品牌ID)",
                    allowClear: true,
                    width: 'resolve'
                });
            });
        </script>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
