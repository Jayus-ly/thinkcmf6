<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>

</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">底部列表</a></li>
        <li><a href="{:url('add')}">新增</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('editPost')}">
        <div class="form-group">
            <label for="input-name" class="col-sm-2 control-label"><span class="form-required">*</span>类型</label>
            <select class="form-control" name="name" id="input-name" style="width: 400px">
                <option value="">请选择类型</option>
                <option value="about" {$data['name']==='about'?'selected="selected"':''}>about</option>
                <option value="contact" {$data['name']==='contact'?'selected="selected"':''}>contact</option>
                <option value="Guidance" {$data['name']==='Guidance'?'selected="selected"':''}>Guidance</option>
                <option value="Disclaimer" {$data['name']==='Disclaimer'?'selected="selected"':''}>Disclaimer</option>
                <option value="Privacy Policy" {$data['name']==='Privacy Policy'?'selected="selected"':''}>Privacy Policy</option>
                <option value="Terms Of Service" {$data['name']==='Terms Of Service'?'selected="selected"':''}>Terms Of Service</option>
            </select>
        </div>
        <!-- 富文本编辑器内容区域 -->
        <div class="form-group">
            <label for="editor" class="col-sm-2 control-label"><span class="form-required">*</span>内容</label>
            <input id="content" type="hidden"  value="{$data['content']}" />
            <div class="col-sm-10">
                <script type="text/plain" id="editor" name="content" style="width:100%;height:300px;"></script>
            </div>
        </div>
        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="hidden" name="id" value="{$data['id']}">
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<!-- UEditor 核心文件 -->
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script>
    var content = UE.getEditor('editor');
    content.ready(function () {
        content.setContent($("#content").val());
    });
</script>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
