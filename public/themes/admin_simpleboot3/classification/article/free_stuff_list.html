<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>

</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li class="active"><a href="{:url('classification/article/freeStuffList')}">免费文章列表</a></li>
        <li><a href="{:url('classification/article/tagList')}">文章标签列表</a></li>
    </ul>
    <form class="well form-inline margin-top-20" method="post" action="{:url('classification/article/freeStuffList')}">
        名称
        <input type="text" name="name" class="form-control" value="{:input('request.name')}" placeholder="输入名称搜索">
        <input type="submit" class="btn btn-primary" value="{:lang('Search')}"/>
        <a class="btn btn-danger" href="{:url('index')}">{:lang('Clear')}</a>
        <a class="btn btn-danger" href="{:url('classification/article/addFreeStuff')}">添加免费文章</a>
    </form>
    <form method="post" class="js-ajax-form">
        <table class="table table-hover table-bordered table-list" id="menus-table">
            <thead>
            <tr>
                <th>ID</th>
                <th>文章标题</th>
                <th>文章图片</th>
                <th>文章标签</th>
                <th>文章内容</th>
                <th>创建时间</th>
                <th>更新时间</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <foreach name="list" item="vo">
                <tr>
                    <td>{$vo.id}</td>
                    <td>{$vo.title}</td>
                    <td>
                        <img src="{:cmf_get_image_preview_url($vo.img_url)}" width="135" style="cursor: hand"/>
                    </td>
                    <td>{$vo.tag}</td>
                    <td title="{$vo.content}" style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{$vo.content}</td>
                    <td>{$vo.create_time}</td>
                    <td>{$vo.update_time}</td>
                    <td>
                        <a class="btn btn-xs btn-primary" href="{:url('editFreeStuff',array('id'=>$vo['id']))}">{:lang('EDIT')}</a>
                        <a class="btn btn-xs btn-danger js-ajax-delete" href="{:url('delFreeStuffPost',array('id'=>$vo['id']))}">
                            {:lang('DELETE')}
                        </a>
                    </td>
                </tr>
            </foreach>
            </tbody>
        </table>
    </form>
</div>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
