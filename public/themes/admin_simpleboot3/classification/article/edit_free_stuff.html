<include file="public@header"/>

<link rel="stylesheet" href="__TMPL__/public/assets/themes/{:cmf_get_admin_style()}/flatpickr.min.css">
<script src="__TMPL__/public/assets/js/flatpickr.js"></script>


<link href="/static/css/select2.min.css" rel="stylesheet" />
<script src="/themes/admin_simpleboot3/public/assets/js/jquery-3.6.0.min.js"></script>
<script src="/static/js/select2.min.js"></script>

</head>
<body>
<div class="wrap">
    <ul class="nav nav-tabs">
        <li><a href="{:url('index')}">免费文章列表</a></li>
    </ul>
    <form method="post" class="form-horizontal js-ajax-form margin-top-20" action="{:url('editFreeStuffPost')}">
        <div class="form-group">
            <label for="input-title" class="col-sm-2 control-label"><span class="form-required">*</span>文章标题</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-title" name="title" value="{$data.title|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label for="input-href" class="col-sm-2 control-label"><span class="form-required">*</span>文章跳转链接地址</label>
            <div class="col-md-6 col-sm-10">
                <input type="text" class="form-control" id="input-href" name="href" value="{$data.href|default=''}">
            </div>
        </div>
        <div class="form-group">
            <label for="thumb" class="col-sm-2 control-label"><span class="form-required">*</span>上传图片</label>
            <div class="col-md-6 col-sm-10">
                <input type="hidden" name="img_url" id="thumb" value="{$data['img_url']}">
                <a href="javascript:uploadOneImage('图片上传','#thumb');">
                    <if condition="empty($data['img_url'])">
                        <img src="__TMPL__/public/assets/images/default-thumbnail.png"
                             id="thumb-preview" width="135" style="cursor: hand"/>
                        <else/>
                        <img src="{:cmf_get_image_preview_url($data['img_url'])}" id="thumb-preview"
                             width="135" style="cursor: hand"/>
                    </if>
                </a>
                <input type="button" class="btn btn-sm"
                       onclick="$('#thumb-preview').attr('src','/themes/admin_simpleboot3/public/assets/images/default-thumbnail.png');$('#thumb').val('');return false;"
                       value="取消图片">
            </div>
        </div>

        <div class="form-group">
            <label for="input-tags" class="col-sm-2 control-label">
                <span class="form-required">*</span>选择文章标签
            </label>
            <div class="col-md-6 col-sm-10">
                <select class="form-control select2" id="input-tags" name="tag[]" multiple="multiple" style="width: 100%;">
                    <foreach name="tags" item="vo">
                        <option value="{$vo['id']}" <?php if(in_array($vo['id'], $data['tag'])): ?>selected<?php endif; ?>>{$vo['name']}</option>
                    </foreach>
                </select>
            </div>
        </div>
        <script>
            $(function() {
                $('.select2').select2({
                    placeholder: "请选择分类",
                    allowClear: true,
                    width: 'resolve'
                });
            });
        </script>

        <!-- 富文本编辑器内容区域 -->
        <div class="form-group">
            <label for="editor" class="col-sm-2 control-label"><span class="form-required">*</span>内容</label>
            <div class="col-sm-10">
                <input id="content" type="hidden"  value="{$data['content']}" />
                <script type="text/plain" id="editor" name="content" style="width:100%;height:300px;"></script>
            </div>
        </div>

        <div class="form-group">
            <div class="col-sm-offset-2 col-sm-10">
                <input type="hidden"  value="{$data['id']}" name="id" />
                <button type="submit" class="btn btn-primary js-ajax-submit">{:lang('SAVE')}</button>
                <a class="btn btn-default" href="{:url('index')}">{:lang('BACK')}</a>
            </div>
        </div>
    </form>
</div>
<!-- UEditor 核心文件 -->
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.config.js"></script>
<script type="text/javascript" src="__STATIC__/js/ueditor/ueditor.all.min.js"></script>
<script>
    var content = UE.getEditor('editor');
    content.ready(function () {
        content.setContent($("#content").val());
    });
</script>
<script src="__STATIC__/js/admin.js?v={$_static_version}"></script>
</body>
</html>
